[env]
MISE_USE_VERSIONS_HOST = "0"

[plugins]
"vfox:mise-ghcup" = "https://github.com/wasp-lang/mise-ghcup.git"

[tools]
# Haskell toolchain used to build/test the cabal backend.
# - aqua:ghcup: the mise-ghcup plugin declares `depends = { "aqua:ghcup" }`, so this
#   exact spec must be configured for mise to put ghcup on the plugin's hook PATH.
# - mise-ghcup:ghc: pinned to a concrete recent GHC (9.14.1, the newest alex
#   builds with). It must be a concrete version, NOT "latest": this repo sets
#   MISE_USE_VERSIONS_HOST=0 to exercise the real hooks, so resolving "latest"
#   would call mise-ghcup's list-versions hook, which requires ghcup to already be
#   installed before it itself is installed. A concrete version skips that lookup
#   and bootstraps cleanly on a fresh CI runner.
# - cabal via aqua, referenced by its full spec rather than the bare `cabal` because
#   this plugin is itself named `cabal`; the bare name is shadowed once the plugin is
#   linked and would not be wired onto the install-hook PATH.
"aqua:ghcup" = "latest"
"mise-ghcup:ghc" = "9.14.1"
"cabal" = "latest"

# Dev / lint tooling. (No `lua` interpreter: hooks run in mise's embedded Lua and
# linting uses lua-language-server. vfox-lua also fails to build on Windows.)
actionlint = "latest"
hk = "latest"
lua-language-server = "latest"
pkl = "latest"
stylua = "latest"

[tasks.format]
description = "Format Lua scripts"
run = "stylua metadata.lua hooks/"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
run = "hk check"

[tasks.lint-fix]
description = "Fix linting issues"
run = "hk fix"

[tasks.ci]
description = "Run all CI checks"
depends = ["lint", "test"]
