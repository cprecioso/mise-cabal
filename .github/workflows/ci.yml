name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          # Cache the installed toolchain (GHC is large) and cabal store.
          cache: true
      # On Windows, mise does not place the plugin's dependency tools (ghc/cabal)
      # on the nested install-hook PATH, so expose them on PATH explicitly. Not
      # needed on Linux/macOS, where the plugin's `depends` wiring works.
      - name: Expose the Haskell toolchain on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ghc_bin="$(mise where mise-ghcup:ghc)/bin"
          cabal_bin="$(mise where aqua:haskell/cabal/cabal-install)"
          echo "$ghc_bin" >> "$GITHUB_PATH"
          echo "$cabal_bin" >> "$GITHUB_PATH"
      - run: mise run ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
