name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is non-blocking: mise does not wire the plugin's dependency tools onto
    # the nested install-hook PATH there (the toolchain is on the step PATH but the
    # hook can't see it). The step below works around it by exposing the toolchain on
    # PATH; kept non-blocking until that is confirmed.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          # Cache the installed toolchain (GHC is large) and cabal store.
          cache: true
      - name: Expose the Haskell toolchain on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ghc_bin="$(mise where mise-ghcup:ghc)/bin"
          cabal_bin="$(mise where aqua:haskell/cabal/cabal-install)"
          echo "$ghc_bin" >> "$GITHUB_PATH"
          echo "$cabal_bin" >> "$GITHUB_PATH"
      - run: mise run ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
